name: Fandango seat notifier

on:
  schedule:
    # Offset from the top of the hour, when GitHub's scheduler is busiest.
    - cron: "2/5 * * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: fandango-seat-notifier
  cancel-in-progress: false

jobs:
  monitor:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Check Fandango
        run: npm run github:monitor
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
      - name: Persist notifier state
        if: ${{ !cancelled() }}
        run: |
          if git diff --quiet -- .notifier-state/state.json; then exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .notifier-state/state.json
          git commit -m "chore: update notifier state [skip ci]"
          git push
